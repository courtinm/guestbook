name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_OUTPUT

    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile \
          --tag ${{ secrets.GOLDBOOK_DOCKER_HUB_USERNAME }}/app_book:${{ steps.version.outputs.VERSION }} \
          --tag ${{ secrets.GOLDBOOK_DOCKER_HUB_USERNAME }}/app_book:latest

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.GOLDBOOK_DOCKER_HUB_USERNAME }}
        password: ${{ secrets.GOLDBOOK_DOCKER_HUB_PAT }}

    - name: Push the Docker image
      run: |
        docker push ${{ secrets.GOLDBOOK_DOCKER_HUB_USERNAME }}/app_book:${{ steps.version.outputs.VERSION }}
        docker push ${{ secrets.GOLDBOOK_DOCKER_HUB_USERNAME }}/app_book:latest