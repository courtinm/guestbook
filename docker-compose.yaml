services:
  nginx:
    image: nginx:stable-alpine3.23
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app_goldbook
    networks:
      - back_end
      - front_end

  redis:
    image: redis:alpine3.22
    container_name: redis
    networks:
      - data

  db:
    image: postgres:alpine3.23
    restart: always
    shm_size: 128mb
    env_file:
      - .env.place_holder
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - vol_pg:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - data

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    networks:
      - data

  app_goldbook:
    image: ${USERNAME_DOCKERHUB}/app_book
    container_name: flask-api
    build: .
    # ports: 
    #   - 8000:8000
    env_file:
      - .env.place_holder
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - redis
      - db
    networks:
      - back_end
      - data

volumes:
  vol_pg:

networks:
  front_end:
    driver: bridge
  back_end:
    driver: bridge
  data:
    driver: bridge